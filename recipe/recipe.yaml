schema_version: 1

context:
  name: dtool_cli
  version: "0.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool-cli/dtool-cli-${{ version }}.tar.gz
  sha256: 2664750dd76ece7d41e8aa7288cda66aef2f04eb4d39dcd13484fc1a193d3385

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - dtool = dtool_cli.cli:dtool

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - click-plugins
    - setuptools <80
    - dtoolcore

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - dtool --help
      - pip check

about:
  license: MIT
  license_file: LICENSE.rst
  summary: The dtool-cli python package provides a skeleton command line interface to dtool that other "dtool" command line packages can be plugged into.
  homepage: https://github.com/jic-dtool/dtool-cli
  repository: https://github.com/jic-dtool/dtool-cli
  documentation: https://github.com/jic-dtool/dtool-cli

extra:
  recipe-maintainers:
    - pvanheus
    - jan-janssen
    - tjelvar-olsson
